  - {name: dtlz1, n_obj: 5, n_var: 9}
  - {name: dtlz2, n_obj: 2, n_var: 11}
  - {name: dtlz2, n_obj: 3, n_var: 12}
  - {name: dtlz2, n_obj: 5, n_var: 14}
  - {name: dtlz3, n_obj: 2, n_var: 11}
  - {name: dtlz3, n_obj: 3, n_var: 12}
  - {name: dtlz3, n_obj: 5, n_var: 14}
  - {name: dtlz4, n_obj: 2, n_var: 11}
  - {name: dtlz4, n_obj: 3, n_var: 12}
  - {name: dtlz4, n_obj: 5, n_var: 14}

algorithm_configs:
  - config/algorithms/oade_nsga2.yaml
  - config/algorithms/nsga2.yaml
  - config/algorithms/rnsga2.yaml
