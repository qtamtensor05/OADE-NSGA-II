temporary_session: true
global:
  runs: 4
  evaluation_budget: 400
  seed_base: 42
  out_dir: tmp/smoke/explicit_session_required
  alpha: 0.05

baseline:
  pop_size: 20
  stagnation_patience: 20
  stagnation_tolerance: 0.0001
  restart_elite_ratio: 0.30
  prob_de: 0.5
  n_neighbors: 5
  mean_F: 0.65
  mean_CR: 0.5

problems:
  - {name: zdt1, n_var: 30}

studies:
  - name: pop_size
    parameter: pop_size
    baseline: 20
    values: [20, 30, 40]
